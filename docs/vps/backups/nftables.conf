#!/usr/sbin/nft -f
# Ansible managed

# clean
flush ruleset

table netdev filter {
  chain ingress {
    type filter hook ingress device eth0 priority -500;

    # IP FRAGMENTS
    ip frag-off & 0x1fff != 0 counter drop

    # TCP XMAS
    tcp flags & (fin|syn|rst|psh|ack|urg) == fin|syn|rst|psh|ack|urg counter drop

    # TCP NULL
    tcp flags & (fin|syn|rst|psh|ack|urg) == 0x0 counter drop

    # TCP MSS
    tcp flags syn \
      tcp option maxseg size 1-536 \
      counter drop
  }
}

table inet mangle {
  chain prerouting {
    type filter hook prerouting priority -150;

    # Conntrack allow established and related traffic
    ct state { established, related } accept

    # CT INVALID
    ct state invalid counter drop

    # TCP SYN (CT NEW)
    tcp flags & (fin|syn|rst|ack) != syn ct state new counter drop
  }
}

table inet filter {
  chain inbound_ipv4 {
  }

  chain inbound_ipv6 {                                                         
    # ICMPv6 packets which must not be dropped, see https://tools.ietf.org/html/rfc4890#section-4.4.1
    meta nfproto ipv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-reply, echo-request, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, 148, 149 } accept
    ip6 saddr fe80::/10 icmpv6 type { 130, 131, 132, 143, 151, 152, 153 } accept

    # accept neighbour discovery otherwise connectivity breaks
    #
    # icmpv6 type { nd-neighbor-solicit, nd-router-advert, nd-neighbor-advert } accept
  }

  chain inbound_wg0 {
    # Allow icmp o wg0 interface
    iifname "wg0" ip protocol icmp accept

    # Accept all Cockpit connections received on Wireguard wg0 interface
    iifname "wg0" tcp dport 9090 accept

    # Accept all iperf3 connections received on Wireguard wg0 interface
    iifname "wg0" tcp dport 5201 accept

    # Allow k3s management
    iifname "wg0" tcp dport 6443 accept
  }
 
  chain inbound_ssh {
    # Rate limit new ssh connections
    ct state new limit rate over 5/second burst 20 packets drop
    counter accept
  }

  chain inbound_local_net_ignore {
    # Silently drop all Kamatera infrastructure UDP probes
    ip saddr { 52.144.45.85, 52.144.46.63 } udp dport {1-65535} drop

    # Silently drop all NETBIOS traffic
    udp dport { 137, 138 } drop 
 
    # Silently drop all Web Services Dynamic Discovery (WS-Discovery)
    udp dport { 3702 } drop 
 
    # Silently drop all MikroTik RouterOS Neighbor Discovery Protocol (MNDP)
    udp dport { 5678 } drop 

    # Silently drop all Dropbox LanSync
    udp dport { 17500 } drop 

    # Silently drop all DHCP messages
    udp dport { 67 } drop 

    # Silently drop all Universal Plug and Play (UPnP)
    udp dport { 1900 } drop
 
    # Silently drop all Spotfire Web Player and Spotfire Automation Services
    udp dport { 9501 } drop

    # Silently drop all Sentinel HASP
    udp dport { 1947 } drop

    # Silently drop all Canto RoboFlow Control
    udp dport { 8998 } drop
  }
 
  chain input {
    # By default, drop all traffic unless it meets a filter
    # criteria specified by the rules that follow below.
    type filter hook input priority filter; policy drop;
    
    # Allow loopback traffic.
    iifname lo accept

    # Allow container internal traffic.
    iifname "cni0" accept
    iifname "flannel.1" accept

    # Anything previously connected jumps on through
    ct state { established, related } accept

    # Anti-lockout rule.  Allow ssh
    tcp dport 22 jump inbound_ssh
    
    # Jump for any special processing for ipv4 or ipv6
    meta protocol vmap { ip : jump inbound_ipv4, ip6 : jump inbound_ipv6 }

    # Allow http, https
    tcp dport {80, 443} ct state new counter accept

    # Allow Mail protocols 
    tcp dport {25} ct state new counter accept

    # Accept all WireGuard packets received on eth0 interface
    iifname eth0 udp dport 59701 counter accept
    iifname wg0 jump inbound_wg0

    jump inbound_local_net_ignore

    # Uncomment to enable logging of denied inbound traffic
    log prefix "[nftables] Inbound Denied: " counter drop
  }

  chain forward {
    # Drop everything (assumes this device is not a router)
    type filter hook forward priority filter; policy drop;

    # Allaw established
    ct state established,related accept
        
    # Allow forwarding to/from container bridge interfaces
    iifname "cni0" accept
    oifname "cni0" accept
    iifname "flannel.1" accept
    oifname "flannel.1" accept
    
    # Accept SSH connections to exposed containers
    tcp dport 22 ct state new counter packets 0 bytes 0 accept
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
