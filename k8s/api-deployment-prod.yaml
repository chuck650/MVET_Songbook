apiVersion: v1
kind: Namespace
metadata:
  name: mvet-songbook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mvet-api
  namespace: mvet-songbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mvet-api
  template:
    metadata:
      labels:
        app: mvet-api
    spec:
      containers:
      - name: api-server
        image: ghcr.io/chuck650/mvet-api:latest
        imagePullPolicy: Always
        env:
        - name: ACTIVE_PSKS
          valueFrom:
              secretKeyRef:
                name: mvet-auth-secrets
                key: ACTIVE_PSKS
        - name: JWT_SECRET
          valueFrom:
              secretKeyRef:
                name: mvet-auth-secrets
                key: JWT_SECRET
        - name: CORS_ORIGINS
          value: "https://chuck650.github.io,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://mvet-api.test"
        - name: DATA_DIR
          value: "/app/data"
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: 256Mi
            cpu: 300m
          requests:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: songs-storage
          mountPath: /app/data
      volumes:
      - name: songs-storage
        hostPath:
          path: /var/data/mvet-songbook
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mvet-api-svc
  namespace: mvet-songbook
spec:
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: mvet-api
